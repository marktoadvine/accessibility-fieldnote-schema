$schema: https://raw.githubusercontent.com/marktoadvine/accessibility-fieldnote-schema/main/schema/fieldnote.schema.json
schemaVersion: "0.2.0"
component:
  id: filter-builder
  name: Custom filter builder
  platform: web
decisions:
  - id: remove-filter
    topic: focus
    status: decided
    answer: When a filter is removed, focus moves to the next filter’s Remove
      control, then the previous one if no next filter exists. If none remain,
      focus moves to Add filter.
  - id: removal-feedback
    topic: state
    status: open
responsibilities: []
limitations: []
checks: []
