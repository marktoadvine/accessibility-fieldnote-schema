<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AFS — Accessibility Fieldnote Schema</title>
  <link rel="preload" href="fonts/inclusive-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>AFS <span>Accessibility Fieldnote Schema</span></h1>
      <span class="version">0.1.1 draft</span>
    </header>
    <section class="component" aria-labelledby="component-title">
      <h2 id="component-title">Component</h2>
      <div class="identity">
        <label>Name<input id="name" value="Confirmation dialogue" maxlength="120"></label>
        <label>ID<input id="component-id" value="dialogue" pattern="[a-z][a-z0-9-]*"></label>
        <label>Version<input id="version" value="0.1.1"></label>
      </div>
    </section>
    <section class="decisions" aria-labelledby="decisions-title">
      <div class="section-head"><h2 id="decisions-title">Decisions</h2><span id="progress">0 of 7 resolved</span></div>
      <p class="context">Web modal dialog · Experimental prompts · <a href="https://www.w3.org/WAI/ARIA/apg/patterns/dialog-modal/">APG guidance</a></p>
      <p class="hint">Documents intent. Does not verify accessibility.</p>
      <div id="questions"></div>
    </section>
    <section class="notes" aria-labelledby="notes-title">
      <h2 id="notes-title">Notes</h2>
      <label>Consumer responsibilities<textarea id="responsibility"></textarea></label>
      <label>Known limitations<textarea id="limitation"></textarea></label>
    </section>
    <section class="exports" aria-label="Record actions">
      <div class="actions">
        <button id="yaml">Export YAML</button>
        <button id="json" class="secondary">JSON</button>
        <button id="markdown" class="secondary">Markdown</button>
        <label class="import">Import JSON<input id="import" type="file" accept="application/json,.json"></label>
        <button id="reset" class="secondary">Reset</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="hint">Saved in this browser. Export to keep a copy.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
