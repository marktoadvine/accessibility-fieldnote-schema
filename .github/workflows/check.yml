name: Check schema and examples
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/fieldnote.py validate examples/*.fieldnote.yaml examples/*.fieldnote.json
      - run: node tests/model.test.mjs
      - run: python tools/fieldnote.py validate /tmp/afs-browser-export.yaml
