name: AFS checks
on: [push, pull_request]
jobs:
  afs-01:
    name: AFS-01 — Schema, examples, and export integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install validator dependencies
        run: npm ci --ignore-scripts
      - name: Verify schema constraints and documentation rendering
        run: npm test
      - name: Validate full and barebones example records
        run: npm run check:examples
